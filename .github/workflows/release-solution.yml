# Module 12 - Release workflow (Upgrade by default, with an opt-out checkbox)
# Starts automatically when "2 - Build solution" succeeds on main.
# Test -> change preview -> (approval) -> Prod. Same zip everywhere.
#
# Import mode per environment:
#   Automatic release              -> Upgrade
#   Manual run, "upgrade" ticked   -> Upgrade (default)
#   Manual run, "upgrade" unticked -> Update  (nothing is deleted)
#   First deployment (no tag yet)  -> Update  (Upgrade needs an existing solution)
# Accidental deletions are stopped earlier, at the PR, by the removal guard in the build
# (only PRs labelled "allow-deletions" can remove components).
#
# Before first run:
#   Settings -> Environments -> "Test" and "Prod", each with variable ENV_URL
#   Prod: Required reviewers (saved)
#   deployment-settings/test.json and prod.json filled in
#   Connections in Test and Prod shared with the app user (Can use)

name: 3 - Release solution

on:
  workflow_run:
    workflows: ["2 - Build solution"]   # must match the build workflow's name exactly
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of the build to deploy (redeploy / rollback)
        required: true
      upgrade:
        description: Upgrade (deletes removed components). Untick for Update - nothing deleted.
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  SOLUTION: Demo
  BUILD_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.build_run_id }}
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # automatic releases have no form -> Upgrade; manual runs follow the checkbox
  UPGRADE_REQUESTED: ${{ github.event_name == 'workflow_run' || inputs.upgrade == true }}

concurrency:
  group: release-solution
  cancel-in-progress: false

jobs:
  deploy-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: Test
    permissions:
      contents: write                    # to move the test-deployed tag
      actions: read
    steps:
      - name: Check out repo (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide import mode for Test
        id: mode
        run: |
          if [ "$UPGRADE_REQUESTED" != "true" ]; then
            echo "upgrade=false" >> "$GITHUB_OUTPUT"; echo "Test: Update (checkbox unticked)"
          elif git ls-remote --exit-code --tags origin refs/tags/test-deployed >/dev/null; then
            echo "upgrade=true" >> "$GITHUB_OUTPUT"; echo "Test: Upgrade"
          else
            echo "upgrade=false" >> "$GITHUB_OUTPUT"; echo "Test: Update (first deployment)"
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: solution-managed
          path: out
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Import into Test
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.ENV_URL }}
          app-id: ${{ vars.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ vars.PP_TENANT_ID }}
          solution-file: out/${{ env.SOLUTION }}_managed.zip
          use-deployment-settings-file: true
          deployment-settings-file: deployment-settings/test.json
          force-overwrite: true
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60
          stage-and-upgrade: ${{ steps.mode.outputs.upgrade }}

      - name: Mark this commit as deployed to Test
        run: |
          git tag -f test-deployed $RELEASE_SHA
          git push -f origin test-deployed

  prod-preview:
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare release with what is in Prod
        run: |
          git fetch --tags --force
          {
            echo "## Changes going to Prod"
            if ! git rev-parse -q --verify refs/tags/prod-deployed >/dev/null; then
              echo "**Mode: Update** - first Prod deployment, no previous release to compare."
            else
              if [ "$UPGRADE_REQUESTED" = "true" ]; then
                echo "**Mode: UPGRADE** - components removed since the last Prod release will be DELETED."
              else
                echo "**Mode: Update** - checkbox unticked, nothing will be deleted."
              fi
              echo ""
              echo "Comparing \`prod-deployed\` with \`${RELEASE_SHA::7}\`"
              echo "### Files changed"
              echo '```'
              git diff --stat prod-deployed $RELEASE_SHA -- solutions/
              echo '```'
              echo "### Removed files"
              echo '```'
              git diff --name-only --diff-filter=D prod-deployed $RELEASE_SHA -- solutions/
              echo '```'
              echo "### Removed columns"
              echo '```'
              git diff prod-deployed $RELEASE_SHA -- 'solutions/**/Entity.xml' \
                | grep -E '^-\s*<attribute PhysicalName=' || echo "(none)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    needs: prod-preview
    runs-on: ubuntu-latest
    environment: Prod                    # waits here for a reviewer's approval
    permissions:
      contents: write                    # to move the prod-deployed tag
      actions: read
    steps:
      - name: Check out repo (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide import mode for Prod
        id: mode
        run: |
          if [ "$UPGRADE_REQUESTED" != "true" ]; then
            echo "upgrade=false" >> "$GITHUB_OUTPUT"; echo "Prod: Update (checkbox unticked)"
          elif git ls-remote --exit-code --tags origin refs/tags/prod-deployed >/dev/null; then
            echo "upgrade=true" >> "$GITHUB_OUTPUT"; echo "Prod: Upgrade"
          else
            echo "upgrade=false" >> "$GITHUB_OUTPUT"; echo "Prod: Update (first deployment)"
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: solution-managed
          path: out
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Import into Prod
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ vars.ENV_URL }}
          app-id: ${{ vars.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ vars.PP_TENANT_ID }}
          solution-file: out/${{ env.SOLUTION }}_managed.zip
          use-deployment-settings-file: true
          deployment-settings-file: deployment-settings/prod.json
          force-overwrite: true
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60
          stage-and-upgrade: ${{ steps.mode.outputs.upgrade }}

      - name: Mark this commit as deployed to Prod
        run: |
          git tag -f prod-deployed $RELEASE_SHA
          git push -f origin prod-deployed